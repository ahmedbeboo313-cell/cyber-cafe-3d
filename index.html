<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>سايبر تايفون 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#07070f;font-family:'Segoe UI',Tahoma,sans-serif;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;top:10px;right:10px;left:10px;display:flex;gap:8px;justify-content:center;z-index:5}
  .chip{background:rgba(10,10,25,.8);border:1px solid #0ff3;padding:8px 14px;border-radius:20px;color:#0ff;font-size:14px;font-weight:bold;backdrop-filter:blur(4px)}
  #bar{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5}
  .btn{background:linear-gradient(135deg,#0ff,#08f);border:none;color:#001;padding:12px 22px;border-radius:14px;font-size:15px;font-weight:bold;box-shadow:0 0 15px #0ff6;cursor:pointer}
  .btn.pink{background:linear-gradient(135deg,#f0f,#80f);color:#fff;box-shadow:0 0 15px #f0f6}
  #panel{position:fixed;top:0;bottom:0;right:0;width:min(340px,90%);background:rgba(8,8,20,.95);border-left:2px solid #0ff;z-index:10;padding:20px;overflow-y:auto;transition:transform .3s}
  #panel.closed{transform:translateX(110%)}
  #panel h2{color:#0ff;margin-bottom:14px;text-align:center}
  .row{background:#111127;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:10px;color:#ddd}
  .row b{color:#fff;display:block;margin-bottom:4px}
  .row small{color:#99f;display:block;margin-bottom:8px}
  .row button{width:100%;background:#0ff;border:none;padding:9px;border-radius:8px;font-weight:bold;color:#001;cursor:pointer}
  .row button:disabled{background:#444;color:#888}
  #toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#0ff;color:#001;padding:10px 20px;border-radius:10px;font-weight:bold;opacity:0;transition:opacity .3s;z-index:20;pointer-events:none}
  #toast.show{opacity:1}
  #start{position:fixed;inset:0;background:radial-gradient(circle,#12122a,#05050c);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;text-align:center;padding:20px}
  #start h1{font-size:34px;color:#0ff;text-shadow:0 0 25px #0ff}
  #start p{color:#aaf;max-width:320px;line-height:1.8}
  #hint{position:fixed;bottom:70px;left:0;right:0;text-align:center;color:#8899bb;font-size:12px;z-index:4}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="hud">
  <div class="chip">🪙 <span id="coins">0</span></div>
  <div class="chip">⭐ <span id="rep">50</span></div>
  <div class="chip">👥 <span id="served">0</span></div>
</div>

<div id="hint">اسحب بإصبعك لتدوير الكاميرا — اضغط على الجهاز الأحمر لإصلاحه</div>

<div id="bar">
  <button class="btn" id="shopBtn">🛒 المتجر والترقيات</button>
</div>

<div id="panel" class="closed">
  <h2>🛒 المتجر والترقيات</h2>
  <div id="rows"></div>
  <button class="btn pink" id="closeBtn" style="width:100%">إغلاق</button>
  <button class="btn" id="resetBtn" style="width:100%;margin-top:10px;background:#333;color:#f66;box-shadow:none">🗑️ تصفير اللعبة</button>
</div>

<div id="toast"></div>

<div id="start">
  <h1>🖥️ سايبر تايفون 3D</h1>
  <p>أنت صاحب سايبر نت في مدينة سايبر بانك!<br>استقبل الزباين، احجزلهم أجهزة، اصلّح الأعطال، وطوّر محلك لحد ما يبقى أشهر سايبر في المدينة.</p>
  <button class="btn" id="playBtn" style="font-size:18px;padding:14px 40px">▶ ابدأ اللعب</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= حالة اللعبة والحفظ =================
const SAVE_KEY='cyberCafeSaveV1';
const DEF={coins:300,rep:50,served:0,owned:4,upg:{internet:0,ac:0,neon:0,drinks:0}};
let S=load();
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(SAVE_KEY))||{})}catch(e){return Object.assign({},DEF)}}
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(S))}

// ================= إعدادات الاقتصاد =================
const PC_COSTS=[500,900,1400,2000,2700,3500];
const UPG={
 internet:{n:'إنترنت فايبر 🌐',d:'+25% أجر كل جلسة',c:l=>300*(l+1),max:4},
 ac:{n:'تكييف مركزي ❄️',d:'+4 ثواني صبر للزباين',c:l=>250*(l+1),max:4},
 neon:{n:'ديكور نيون 💡',d:'الزباين يوصلوا أسرع',c:l=>350*(l+1),max:4},
 drinks:{n:'كافيه مشروبات ☕',d:'+4 عملة لكل زبون',c:l=>200*(l+1),max:4}
};
const payPer=()=>Math.round((10+S.upg.drinks*4)*(1+S.upg.internet*0.25));
const patience=()=>12+S.upg.ac*4;
const spawnInterval=()=>Math.max(2.2,(7-S.upg.neon*0.8)*(1.6-S.rep/100));

// ================= المشهد ثلاثي الأبعاد =================
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x07070f);
scene.fog=new THREE.Fog(0x07070f,30,65);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x404060,1.1));
const dir=new THREE.DirectionalLight(0x8888ff,.7);dir.position.set(5,15,8);scene.add(dir);
const neonLights=[];
[[0x00ffff,-6,3.5,-7.5],[0xff00ff,6,3.5,-7.5],[0x00ff88,0,3.5,7]].forEach(c=>{
 const l=new THREE.PointLight(c[0],1.2,18);l.position.set(c[1],c[2],c[3]);scene.add(l);neonLights.push(l);
});

// ================= بناء الكافيه =================
const M=(c,e,ei)=>new THREE.MeshStandardMaterial({color:c,roughness:.6,metalness:.3,emissive:e||0x000000,emissiveIntensity:ei||0});
const floor=new THREE.Mesh(new THREE.BoxGeometry(22,.4,16),M(0x14141f));floor.position.y=-.2;scene.add(floor);
const wallM=M(0x1a1a2e);
const back=new THREE.Mesh(new THREE.BoxGeometry(22,4,.4),wallM);back.position.set(0,2,-8);scene.add(back);
const left=new THREE.Mesh(new THREE.BoxGeometry(.4,4,16),wallM);left.position.set(-11,2,0);scene.add(left);
const right=new THREE.Mesh(new THREE.BoxGeometry(.4,4,16),wallM);right.position.set(11,2,0);scene.add(right);
const f1=new THREE.Mesh(new THREE.BoxGeometry(9,4,.4),wallM);f1.position.set(-6.5,2,8);scene.add(f1);
const f2=new THREE.Mesh(new THREE.BoxGeometry(9,4,.4),wallM);f2.position.set(6.5,2,8);scene.add(f2);
// شرائط نيون
const strips=[];
[[-6.5,3.9,-7.7,0x00ffff],[6.5,3.9,-7.7,0xff00ff],[-10.7,3.9,0,0x00ff88],[10.7,3.9,0,0xffaa00]].forEach(s=>{
 const m=new THREE.Mesh(new THREE.BoxGeometry(s[0]===-10.7||s[0]===10.7?.2:9,.15,s[0]===-10.7||s[0]===10.7?15:.2),
  new THREE.MeshStandardMaterial({color:0x000000,emissive:s[3],emissiveIntensity:2}));
 m.position.set(s[0],s[1],s[2]);scene.add(m);strips.push(m.material);
});
// لافتة المحل
const cv=document.createElement('canvas');cv.width=512;cv.height=128;
const cx=cv.getContext('2d');cx.fillStyle='#050510';cx.fillRect(0,0,512,128);
cx.font='bold 60px Tahoma';cx.textAlign='center';cx.fillStyle='#00ffff';cx.shadowColor='#00ffff';cx.shadowBlur=25;
cx.fillText('سايبر تايفون',256,85);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));
sign.position.set(0,4.6,7.75);scene.add(sign);

// ================= الأجهزة (محطات الحجز) =================
const SLOT_X=[-8,-4,0,4,8],SLOT_Z=[-4.5,0.5];
const stations=[],hitMeshes=[];
function buildStation(i){
 const x=SLOT_X[i%5],z=Math.floor(i/5)<1?SLOT_Z[0]:SLOT_Z[1];
 const g=new THREE.Group();g.position.set(x,0,z);
 const desk=new THREE.Mesh(new THREE.BoxGeometry(2,.15,1),M(0x22223a));desk.position.y=.85;g.add(desk);
 const leg1=new THREE.Mesh(new THREE.BoxGeometry(.12,.85,.12),M(0x111122));leg1.position.set(-.85,.42,-.4);g.add(leg1);
 const leg2=leg1.clone();leg2.position.x=.85;g.add(leg2);
 const leg3=leg1.clone();leg3.position.z=.4;g.add(leg3);
 const leg4=leg1.clone();leg4.position.set(.85,.42,.4);g.add(leg4);
 const mon=new THREE.Mesh(new THREE.BoxGeometry(1.3,.85,.08),M(0x0a0a15));mon.position.set(0,1.45,-.3);g.add(mon);
 const screenMat=new THREE.MeshStandardMaterial({color:0x000000,emissive:0x00ff88,emissiveIntensity:1.5});
 const screen=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.7),screenMat);screen.position.set(0,1.45,-.255);g.add(screen);
 const tower=new THREE.Mesh(new THREE.BoxGeometry(.3,.7,.6),M(0x111122,0x00ffff,.6));tower.position.set(.75,.35,-.2);g.add(tower);
 const chair=new THREE.Mesh(new THREE.BoxGeometry(.7,.12,.7),M(0x331144));chair.position.set(0,.55,.85);g.add(chair);
 const cback=new THREE.Mesh(new THREE.BoxGeometry(.7,.7,.1),M(0x331144));cback.position.set(0,.95,1.15);g.add(cback);
 [desk,mon,tower].forEach(h=>{h.userData.st=i;hitMeshes.push(h)});
 g.visible=i<S.owned;scene.add(g);
 stations.push({g,screen:screenMat,broken:false,occupied:false,cust:null,x,z});
}
for(let i=0;i<10;i++)buildStation(i);

// ================= الزباين =================
const QUEUE=[[-1.6,5.6],[0,5.6],[1.6,5.6],[-1.6,6.6],[0,6.6],[1.6,6.6]];
const queueFree=[true,true,true,true,true,true];
const customers=[];
const COLORS=[0xff6688,0x66ff99,0x6699ff,0xffcc44,0xcc66ff,0x66ffee];
function makeCustomer(){
 const qi=queueFree.indexOf(true);if(qi<0)return;queueFree[qi]=false;
 const g=new THREE.Group();
 const col=COLORS[Math.floor(Math.random()*COLORS.length)];
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.28,.35,1.05,8),M(col));body.position.y=.75;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.26,10,10),M(0xffddbb));head.position.y=1.5;g.add(head);
 const ind=new THREE.Mesh(new THREE.BoxGeometry(.5,.08,.08),new THREE.MeshBasicMaterial({color:0x00ff00}));ind.position.y=1.95;g.add(ind);
 g.position.set(0,0,9.5);scene.add(g);
 customers.push({g,ind:ind.material,qi,state:'in',pat:patience(),tgt:new THREE.Vector3(QUEUE[qi][0],0,QUEUE[qi][1]),st:null,ses:0});
}
function freeQueue(c){if(c.qi>=0){queueFree[c.qi]=true;c.qi=-1}}
function walk(c,dt){
 const d=c.tgt.clone().sub(c.g.position);d.y=0;
 if(d.length()<.15)return true;
 d.normalize();c.g.position.addScaledVector(d,2.3*dt);
 c.g.lookAt(c.g.position.x+d.x,0,c.g.position.z+d.z);return false;
}
function updateCustomers(dt){
 for(let i=customers.length-1;i>=0;i--){
  const c=customers[i];
  if(c.state==='in'||c.state==='toPC'||c.state==='out'){
   if(walk(c,dt)){
    if(c.state==='in')c.state='wait';
    else if(c.state==='toPC'){c.state='sit';c.st.occupied=true;c.st.cust=c;c.st.screen.emissive.setHex(0x0088ff);c.ses=18+Math.random()*12;}
    else{scene.remove(c.g);freeQueue(c);customers.splice(i,1);}
   }
  }else if(c.state==='wait'){
   c.pat-=dt;
   const st=stations.find(s=>s.g.visible&&!s.occupied&&!s.broken);
   if(st){freeQueue(c);c.st=st;c.state='toPC';c.tgt=new THREE.Vector3(st.x,0,st.z+.85);}
   else if(c.pat<=0){freeQueue(c);S.rep=Math.max(0,S.rep-3);toast('😡 زبون مشي زعلان! −سمعة');c.state='out';c.tgt=new THREE.Vector3(0,0,10);}
  }else if(c.state==='sit'){
   c.ses-=dt;
   if(c.ses<=0){
    S.coins+=payPer();S.served++;S.rep=Math.min(100,S.rep+1);
    beep(880,.07);setTimeout(()=>beep(1320,.09),80);
    c.st.occupied=false;c.st.cust=null;
    if(Math.random()<.12){c.st.broken=true;c.st.screen.emissive.setHex(0xff2244);toast('⚠️ جهاز عطلان! اضغط عليه لإصلاحه');}
    else c.st.screen.emissive.setHex(0x00ff88);
    c.state='out';c.tgt=new THREE.Vector3(0,0,10);
   }
  }
  if(c.state==='wait'){const r=Math.max(0,Math.min(1,c.pat/patience()));c.ind.color.setRGB(1-r,r,0);}
 }
}

// ================= الكاميرا (سحب للتدوير) =================
let camA=0,dragging=false,lx=0,moved=0,downT=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;moved=0;downT=Date.now()});
addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx;lx=e.clientX;moved+=Math.abs(dx);camA=Math.max(-.9,Math.min(.9,camA+dx*.004))});
addEventListener('pointerup',e=>{dragging=false;if(moved<8&&Date.now()-downT<350)tap(e)});
function tap(e){
 const r=new THREE.Raycaster();
 r.setFromCamera({x:(e.clientX/innerWidth)*2-1,y:-(e.clientY/innerHeight)*2+1},camera);
 const hit=r.intersectObjects(hitMeshes)[0];
 if(hit){const st=stations[hit.object.userData.st];
  if(st.broken){st.broken=false;st.screen.emissive.setHex(0x00ff88);beep(520,.1);toast('🔧 تم إصلاح الجهاز!');}
 }
}

// ================= الواجهة =================
const $=id=>document.getElementById(id);
function hud(){$('coins').textContent=S.coins;$('rep').textContent=Math.round(S.rep);$('served').textContent=S.served}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}
function renderPanel(){
 let h='';
 if(S.owned<10){const c=PC_COSTS[S.owned-4];
  h+=`<div class="row"><b>🖥️ جهاز جديد (رقم ${S.owned+1})</b><small>مقعد حجز إضافي للزباين</small><button data-pc="${c}" ${S.coins<c?'disabled':''}>شراء بـ ${c} 🪙</button></div>`;}
 for(const k in UPG){const u=UPG[k],l=S.upg[k],maxed=l>=u.max,c=u.c(l);
  h+=`<div class="row"><b>${u.n} — مستوى ${l}/${u.max}</b><small>${u.d}</small><button data-up="${k}" ${maxed||S.coins<c?'disabled':''}>${maxed?'أقصى مستوى':'ترقية بـ '+c+' 🪙'}</button></div>`;}
 $('rows').innerHTML=h;
 $('rows').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  if(b.dataset.pc){const c=+b.dataset.pc;if(S.coins>=c){S.coins-=c;S.owned++;stations[S.owned-1].g.visible=true;beep(660,.12);toast('🖥️ جهاز جديد اتضاف!');save();hud();renderPanel();}}
  else{const k=b.dataset.up,c=UPG[k].c(S.upg[k]);if(S.coins>=c&&S.upg[k]<UPG[k].max){S.coins-=c;S.upg[k]++;beep(760,.12);toast('⬆️ ترقية جديدة!');save();hud();renderPanel();}}
 });
}
$('shopBtn').onclick=()=>{renderPanel();$('panel').classList.remove('closed')};
$('closeBtn').onclick=()=>$('panel').classList.add('closed');
$('resetBtn').onclick=()=>{if(confirm('متأكد عايز تبدأ من الأول؟')){localStorage.removeItem(SAVE_KEY);location.reload()}};

// ================= صوت بسيط =================
let AC;function beep(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';
 g.gain.setValueAtTime(.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

// ================= الحلقة الرئيسية =================
let started=false,spawnT=3,saveT=0,t=0;
$('playBtn').onclick=()=>{started=true;$('start').classList.add('hidden');beep(440,.1);setTimeout(()=>beep(880,.15),120)};
const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock.getDelta(),.05);t+=dt;
 camera.position.set(Math.sin(camA)*19,14,Math.cos(camA)*19);camera.lookAt(0,1,0);
 strips.forEach((m,i)=>m.emissiveIntensity=1.6+Math.sin(t*3+i*2)*.6);
 neonLights.forEach((l,i)=>l.intensity=1+Math.sin(t*2.5+i)*.35);
 if(started){
  spawnT-=dt;
  if(spawnT<=0){if(customers.length<12)makeCustomer();spawnT=spawnInterval();}
  updateCustomers(dt);
  saveT+=dt;if(saveT>5){saveT=0;save();}
 }
 hud();
 renderer.render(scene,camera);
}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
